[package]
name = "epoch-core"
version = "0.1.0"
edition = "2024"

[dependencies]
chromiumoxide = "0.9.1"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
futures = "0.3.34"
lol_html = "3.0.2"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "chrono"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "macros"] }
url = "2.5.8"
